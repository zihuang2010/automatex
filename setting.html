<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>MQTT Settings Modal</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
            rel="stylesheet"
        />
        <script>
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            primary: '#3b82f6', // Professional Blue
                            'background-light': '#f3f4f6',
                            'background-dark': '#111827',
                        },
                        fontFamily: {
                            display: ['Inter', 'sans-serif'],
                            mono: ['JetBrains Mono', 'monospace'],
                        },
                        borderRadius: {
                            DEFAULT: '8px',
                        },
                    },
                },
            };
        </script>
        <style>
            body {
                font-family:
                    'Inter',
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
            }
            .modal-shadow {
                box-shadow:
                    0 20px 25px -5px rgba(0, 0, 0, 0.1),
                    0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
            input::placeholder {
                color: #9ca3af;
            }
        </style>
    </head>
    <body
        class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4"
    >
        <div
            class="w-full max-w-lg bg-white dark:bg-gray-900 rounded-[16px] modal-shadow overflow-hidden border border-gray-100 dark:border-gray-800 animate-in fade-in zoom-in duration-300"
        >
            <div
                class="px-6 py-4 flex items-center justify-between border-b border-gray-100 dark:border-gray-800"
            >
                <div class="flex items-center gap-2 text-gray-800 dark:text-gray-100">
                    <span class="material-icons-round text-gray-400 dark:text-gray-500 text-xl"
                        >settings</span
                    >
                    <h1 class="text-lg font-semibold tracking-tight">设置</h1>
                </div>
                <button
                    class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors"
                >
                    <span class="material-icons-round">close</span>
                </button>
            </div>
            <div class="p-6 space-y-8">
                <section class="space-y-4">
                    <h2
                        class="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 px-1"
                    >
                        MQTT 服务器
                    </h2>
                    <div class="space-y-4">
                        <div class="grid grid-cols-12 gap-4">
                            <div class="col-span-8 space-y-1.5">
                                <label
                                    class="text-sm font-medium text-gray-600 dark:text-gray-400 px-1"
                                    >主机</label
                                >
                                <input
                                    class="w-full bg-gray-50 dark:bg-gray-800/50 border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-mono text-sm"
                                    placeholder="127.0.0.1"
                                    type="text"
                                />
                            </div>
                            <div class="col-span-4 space-y-1.5">
                                <label
                                    class="text-sm font-medium text-gray-600 dark:text-gray-400 px-1"
                                    >端口</label
                                >
                                <input
                                    class="w-full bg-gray-50 dark:bg-gray-800/50 border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-mono text-sm"
                                    placeholder="1883"
                                    type="number"
                                />
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-sm font-medium text-gray-600 dark:text-gray-400 px-1"
                                >客户端 ID</label
                            >
                            <input
                                class="w-full bg-gray-50 dark:bg-gray-800/50 border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-mono text-sm"
                                type="text"
                                value="automatex-57291"
                            />
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label
                                    class="text-sm font-medium text-gray-600 dark:text-gray-400 px-1"
                                    >用户名
                                    <span class="text-gray-400 font-normal">(可选)</span></label
                                >
                                <input
                                    class="w-full bg-gray-50 dark:bg-gray-800/50 border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm"
                                    placeholder="用户名"
                                    type="text"
                                />
                            </div>
                            <div class="space-y-1.5">
                                <label
                                    class="text-sm font-medium text-gray-600 dark:text-gray-400 px-1"
                                    >密码
                                    <span class="text-gray-400 font-normal">(可选)</span></label
                                >
                                <input
                                    class="w-full bg-gray-50 dark:bg-gray-800/50 border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5 text-gray-700 dark:text-gray-200 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm"
                                    placeholder="密码"
                                    type="password"
                                />
                            </div>
                        </div>
                    </div>
                </section>
                <section class="space-y-4">
                    <h2
                        class="text-xs font-bold uppercase tracking-wider text-gray-400 dark:text-gray-500 px-1"
                    >
                        MQTT 状态
                    </h2>
                    <div
                        class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800/30 rounded-xl border border-dashed border-gray-200 dark:border-gray-700"
                    >
                        <div class="flex items-center gap-3">
                            <div
                                class="w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600 animate-pulse"
                            ></div>
                            <span class="text-sm font-medium text-gray-500 dark:text-gray-400"
                                >未连接</span
                            >
                        </div>
                        <div class="flex gap-2">
                            <button
                                class="px-4 py-1.5 text-sm font-medium rounded-full border border-emerald-500 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 transition-colors"
                            >
                                连接
                            </button>
                            <button
                                class="px-4 py-1.5 text-sm font-medium rounded-full border border-rose-400 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 transition-colors opacity-50 cursor-not-allowed"
                            >
                                断开
                            </button>
                        </div>
                    </div>
                </section>
            </div>
            <div
                class="px-6 py-5 bg-gray-50 dark:bg-gray-800/50 flex justify-end gap-3 border-t border-gray-100 dark:border-gray-800"
            >
                <button
                    class="px-6 py-2 text-sm font-medium text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-white dark:hover:bg-gray-700 transition-all"
                >
                    取消
                </button>
                <button
                    class="bg-primary hover:bg-blue-600 text-white px-8 py-2 text-sm font-semibold rounded-lg shadow-sm shadow-primary/20 transition-all active:scale-[0.98]"
                >
                    保存
                </button>
            </div>
        </div>
        <div class="fixed bottom-4 right-4">
            <button
                class="p-2 bg-white dark:bg-gray-800 rounded-full shadow-lg border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300"
                onclick="document.documentElement.classList.toggle('dark')"
            >
                <span class="material-icons-round block dark:hidden">dark_mode</span>
                <span class="material-icons-round hidden dark:block">light_mode</span>
            </button>
        </div>
    </body>
</html>
