name: Release

# 触发：
#   - push 标签 v* （正常发布路径）
#   - 手动派发（调试用）
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（手动派发时使用，不带 v 前缀；tag 触发会忽略此输入）'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" | tee -a "$GITHUB_OUTPUT"

          # tag 触发时强制要求三处版本号已与 tag 对齐，避免发布出半成品
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PKG=$(node -p "require('./package.json').version")
            if [ "$PKG" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION 与 package.json 版本 $PKG 不一致。"
              echo "::error::请先在本地: npm run version:bump $VERSION && git commit -am 'release: v$VERSION' && git tag v$VERSION && git push --tags"
              exit 1
            fi
          fi

  build-macos:
    name: macOS ${{ matrix.label }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14    # Apple Silicon (arm64)
            target: aarch64-apple-darwin
            arch_arg: arm64
            out_dir: macos-arm64
            label: arm64
          - runner: macos-13    # Intel (x86_64)
            target: x86_64-apple-darwin
            arch_arg: x86_64
            out_dir: macos-x64
            label: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing key is injected
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret 未配置或未注入到本 job"
            echo "::error::到 Settings → Secrets and variables → Actions → New repository secret 添加："
            echo "::error::  Name: TAURI_SIGNING_PRIVATE_KEY"
            echo "::error::  Value: 本地 ~/.tauri/automatex.key 整个文件内容（包含 untrusted comment 行）"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY length: ${#TAURI_SIGNING_PRIVATE_KEY}"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 已设置"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD 未设置（如果你的密钥有密码会签名失败）"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backends/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('backends/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: bash scripts/build-macos.sh ${{ matrix.arch_arg }}

      - name: Stage artifacts
        shell: bash
        run: |
          OUT="backends/target/output/${{ matrix.out_dir }}"
          BUNDLE="backends/target/${{ matrix.target }}/release/bundle"
          echo "── output dir ──"
          ls -la "$OUT" || true
          echo "── tauri 原始 bundle/macos（包含 .app.tar.gz + .sig）──"
          ls -la "$BUNDLE/macos" || true

          mkdir -p stage
          if ! cp "$OUT"/*.app.tar.gz stage/ 2>/dev/null; then
            echo "::error::缺少 *.app.tar.gz —— build-macos.sh 没有产出 updater 包"
            exit 1
          fi
          if ! cp "$OUT"/*.app.tar.gz.sig stage/ 2>/dev/null; then
            echo "::error::缺少 *.app.tar.gz.sig —— TAURI_SIGNING_PRIVATE_KEY 没正确传给 tauri build"
            echo "::error::或密钥密码错误。检查上面的 verify 步骤输出。"
            exit 1
          fi
          echo "── stage ──"
          ls -la stage/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch_arg }}
          path: stage/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows NSIS
    needs: meta
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing key is injected
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret 未配置或未注入到本 job"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY length: ${#TAURI_SIGNING_PRIVATE_KEY}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backends/target
          key: cargo-x86_64-pc-windows-msvc-${{ hashFiles('backends/Cargo.lock') }}
          restore-keys: cargo-x86_64-pc-windows-msvc-

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Stage artifacts
        shell: bash
        run: |
          BUNDLE="backends/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          echo "── tauri 原始 bundle/nsis ──"
          ls -la "$BUNDLE" || true

          mkdir -p stage
          if ! cp "$BUNDLE"/*-setup.exe stage/ 2>/dev/null; then
            echo "::error::缺少 *-setup.exe —— NSIS 安装包未生成"
            exit 1
          fi
          if ! cp "$BUNDLE"/*.nsis.zip stage/ 2>/dev/null; then
            echo "::error::缺少 *.nsis.zip —— updater 包未生成"
            exit 1
          fi
          if ! cp "$BUNDLE"/*.nsis.zip.sig stage/ 2>/dev/null; then
            echo "::error::缺少 *.nsis.zip.sig —— TAURI_SIGNING_PRIVATE_KEY 没正确签名"
            exit 1
          fi
          echo "── stage ──"
          ls -la stage/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: stage/*
          if-no-files-found: error
          retention-days: 30

  manifest:
    name: Combine + manifest
    needs: [meta, build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      OSS_BASE_URL: ${{ vars.OSS_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact-staging

      - name: Stage to dist-release
        shell: bash
        run: |
          DIST="dist-release/${{ needs.meta.outputs.version }}"
          mkdir -p "$DIST"
          find artifact-staging -type f -exec cp {} "$DIST/" \;
          echo "── 合并后的产物清单 ──"
          ls -la "$DIST"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate latest.json
        shell: bash
        run: |
          if [ -z "$OSS_BASE_URL" ]; then
            echo "::error::缺少仓库 Variable OSS_BASE_URL"
            echo "::error::Settings → Secrets and variables → Actions → Variables → New repository variable"
            echo "::error::Name: OSS_BASE_URL  Value: https://your-bucket.oss-cn-zhangjiakou.aliyuncs.com/automatex-releases"
            exit 1
          fi
          bash scripts/make-manifest.sh "${{ needs.meta.outputs.version }}"
          echo "── latest.json ──"
          cat "dist-release/${{ needs.meta.outputs.version }}/latest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: AutomateX-release-${{ needs.meta.outputs.version }}
          path: dist-release/${{ needs.meta.outputs.version }}/*
          retention-days: 30
