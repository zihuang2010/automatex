name: Release Windows

# 触发：手动派发，或 push v* 标签
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，仅用于工件命名）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-windows-nsis:
    name: Build Windows NSIS + Updater
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backends/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backends/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p dist-windows
          BUNDLE_DIR="backends/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          ls -la "$BUNDLE_DIR" || true
          cp "$BUNDLE_DIR"/*-setup.exe       dist-windows/ 2>/dev/null || true
          cp "$BUNDLE_DIR"/*.nsis.zip        dist-windows/ 2>/dev/null || true
          cp "$BUNDLE_DIR"/*.nsis.zip.sig    dist-windows/ 2>/dev/null || true
          ls -la dist-windows/

      - name: Resolve version label
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutomateX-windows-x64-nsis-${{ steps.ver.outputs.version }}
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 30
