<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/src/styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AutomateX 工作台 PRO v2</title>
    </head>

    <body>
        <!-- ===== 开屏 ===== -->
        <div class="splash" id="splash">
            <!-- 浅色渐变背景光晕 -->
            <div class="splash-bg-glow splash-bg-glow-1"></div>
            <div class="splash-bg-glow splash-bg-glow-2"></div>
            <div class="splash-bg-glow splash-bg-glow-3"></div>

            <!-- 网格底纹 -->
            <div class="splash-grid"></div>

            <!-- 浮动粒子 -->
            <div class="splash-particles">
                <div
                    class="splash-particle"
                    style="
                        --x: 15%;
                        --y: 20%;
                        --size: 4px;
                        --dur: 6s;
                        --delay: 0s;
                        --color: rgba(99, 102, 241, 0.4);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 80%;
                        --y: 15%;
                        --size: 3px;
                        --dur: 8s;
                        --delay: 1s;
                        --color: rgba(59, 130, 246, 0.35);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 25%;
                        --y: 75%;
                        --size: 5px;
                        --dur: 7s;
                        --delay: 0.5s;
                        --color: rgba(6, 182, 212, 0.3);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 70%;
                        --y: 80%;
                        --size: 3px;
                        --dur: 9s;
                        --delay: 2s;
                        --color: rgba(99, 102, 241, 0.3);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 50%;
                        --y: 10%;
                        --size: 4px;
                        --dur: 10s;
                        --delay: 1.5s;
                        --color: rgba(59, 130, 246, 0.25);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 90%;
                        --y: 50%;
                        --size: 3px;
                        --dur: 7s;
                        --delay: 0.8s;
                        --color: rgba(6, 182, 212, 0.35);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 10%;
                        --y: 50%;
                        --size: 5px;
                        --dur: 11s;
                        --delay: 3s;
                        --color: rgba(99, 102, 241, 0.2);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 40%;
                        --y: 90%;
                        --size: 3px;
                        --dur: 8s;
                        --delay: 2.5s;
                        --color: rgba(59, 130, 246, 0.3);
                    "
                ></div>
            </div>

            <!-- 旋转轨道 -->
            <div class="splash-orbit splash-orbit-1"></div>
            <div class="splash-orbit splash-orbit-2"></div>
            <div class="splash-orbit splash-orbit-3"></div>

            <!-- Shimmer 光带 -->
            <div class="splash-shimmer"></div>

            <!-- 中心内容 -->
            <div class="splash-center">
                <div class="splash-glow"></div>
                <div class="splash-logo-wrap">
                    <svg class="splash-logo" viewBox="0 0 120 120" width="88" height="88">
                        <defs>
                            <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#6366f1" />
                                <stop offset="50%" stop-color="#3b82f6" />
                                <stop offset="100%" stop-color="#06b6d4" />
                            </linearGradient>
                            <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#818cf8" />
                                <stop offset="100%" stop-color="#67e8f9" />
                            </linearGradient>
                            <filter id="sdrop">
                                <feDropShadow
                                    dx="0"
                                    dy="4"
                                    stdDeviation="12"
                                    flood-color="rgba(99,102,241,0.35)"
                                />
                            </filter>
                        </defs>
                        <g filter="url(#sdrop)">
                            <rect x="15" y="15" width="90" height="90" rx="26" fill="url(#sg1)" />
                            <path
                                d="M67 30 L43 62 L56 62 L52 90 L77 55 L63 55 L67 30Z"
                                fill="white"
                                opacity="0.95"
                            />
                            <circle cx="40" cy="85" r="3.5" fill="url(#sg2)" opacity="0.7" />
                            <circle cx="60" cy="85" r="3.5" fill="url(#sg2)" opacity="0.5" />
                            <circle cx="80" cy="85" r="3.5" fill="url(#sg2)" opacity="0.7" />
                            <line
                                x1="44"
                                y1="85"
                                x2="56"
                                y2="85"
                                stroke="url(#sg2)"
                                stroke-width="1.5"
                                opacity="0.4"
                            />
                            <line
                                x1="64"
                                y1="85"
                                x2="76"
                                y2="85"
                                stroke="url(#sg2)"
                                stroke-width="1.5"
                                opacity="0.4"
                            />
                        </g>
                    </svg>
                </div>
                <h1 class="splash-name">AutomateX</h1>
                <p class="splash-tagline tracking-tighter">设备自动化平台</p>
                <div class="splash-time">--:--</div>

                <span class="splash-version">v1.0.2-STABLE</span>
            </div>
        </div>

        <!-- ===== 主应用 ===== -->
        <div class="app h-screen flex flex-col overflow-hidden" id="app">
            <!-- Header (code.html style) -->
            <header
                class="bg-white border-b border-slate-200 px-5 flex items-center justify-between shrink-0 z-30 h-10"
            >
                <div class="flex items-center space-x-3">
                    <div class="bg-blue p-1 rounded text-white">
                        <span class="material-symbols-outlined text-base fill-1">bolt</span>
                    </div>
                    <div class="flex items-baseline space-x-2">
                        <h1 class="text-sm font-black tracking-tight text-slate-800 leading-none">
                            AutomateX Workspace <span class="text-blue">PRO</span>
                        </h1>
                        <span
                            class="text-[12px] text-slate-400 font-bold uppercase tracking-normal border-l border-slate-200 pl-2"
                            >企业客户端</span
                        >
                    </div>
                </div>
                <div class="flex items-center">
                    <div
                        class="flex items-center text-slate-500 font-bold text-[10px] uppercase tracking-widest"
                        id="topbar-status"
                    >
                        <span class="pulsing-dot">已连接</span>
                    </div>
                </div>
            </header>

            <!-- 三栏主体 -->
            <main class="flex-1 p-3 flex gap-3 overflow-hidden">
                <!-- 左栏：任务队列 -->
                <aside
                    class="w-[280px] bg-white rounded-md border border-[var(--panel-border)] shadow-sm flex flex-col h-full overflow-hidden shrink-0"
                >
                    <div
                        class="p-3 border-b border-slate-100 bg-slate-50/30 flex justify-between items-center"
                    >
                        <div>
                            <h2
                                class="text-[13px] font-black text-slate-500 uppercase tracking-normal leading-none"
                            >
                                任务队列
                            </h2>
                            <p
                                class="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-normal queue-sub"
                            >
                                0 个进行中任务
                            </p>
                        </div>
                        <button class="material-symbols-outlined text-slate-400 text-base">
                            filter_list
                        </button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-2.5 space-y-2" id="chain-cards">
                        <div class="empty-hint">选择任务以查看详情</div>
                    </div>
                </aside>

                <!-- 中栏：任务详情 -->
                <section class="flex-1 flex flex-col h-full overflow-hidden min-w-0" id="col-mid">
                    <div class="empty-hint" style="padding: 40px; text-align: center">
                        选择任务以查看详情
                    </div>
                </section>

                <!-- 右栏：设备管理 -->
                <aside
                    class="w-[280px] bg-white rounded-md border border-[var(--panel-border)] shadow-sm flex flex-col h-full overflow-hidden shrink-0"
                >
                    <div
                        class="p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50/30"
                    >
                        <h2 class="text-[13px] font-black text-slate-500 uppercase tracking-normal">
                            设备管理
                        </h2>
                        <span
                            class="text-[11px] font-bold text-slate-400 bg-slate-200/50 px-1.5 py-0.5 rounded"
                            id="dev-count"
                            >共 0 台</span
                        >
                    </div>
                    <div class="flex-1 overflow-y-auto" id="device-tree">
                        <div class="empty-hint">点击 <strong>WiFi</strong> 添加设备</div>
                    </div>
                    <div class="p-3 border-t border-slate-100 bg-white space-y-2">
                        <div class="grid grid-cols-2 gap-1.5">
                            <button
                                class="flex flex-col items-center justify-center py-2 bg-white border border-slate-200 text-slate-500 hover:border-blue-500 hover:text-blue-600 rounded-lg transition-all text-[9px] font-black uppercase"
                                id="btn-add-device"
                            >
                                <span class="material-symbols-outlined text-base mb-0.5">wifi</span
                                >WiFi连接
                            </button>
                            <button
                                class="flex flex-col items-center justify-center py-2 bg-white border border-slate-200 text-slate-300 rounded-lg transition-all text-[9px] font-black uppercase disabled:opacity-50 disabled:cursor-not-allowed enabled:text-red-500 enabled:border-red-200 enabled:hover:bg-red-50 enabled:hover:border-red-400"
                                id="btn-remove-selected"
                                disabled
                            >
                                <span class="material-symbols-outlined text-base mb-0.5"
                                    >delete</span
                                >移除设备
                            </button>
                        </div>
                        <div class="flex items-center justify-between pt-1">
                            <span
                                class="text-[8px] font-bold text-slate-400 uppercase tracking-widest"
                                >v1.0.2-STABLE</span
                            >
                            <button
                                class="text-slate-400 hover:text-slate-600 transition-colors"
                                id="btn-settings"
                            >
                                <span class="material-symbols-outlined text-lg">settings</span>
                            </button>
                        </div>
                    </div>
                </aside>
            </main>
        </div>

        <!-- 添加设备对话框 -->
        <div class="modal-mask" id="add-device-modal" style="display: none">
            <div class="modal-card" style="max-width: 400px">
                <div class="flex items-center justify-between px-6 py-4.5 border-b border-s100">
                    <h3 class="text-base font-bold text-s900">添加设备</h3>
                    <button
                        class="w-8 h-8 flex items-center justify-center bg-transparent border-none rounded-sm text-s400 text-base cursor-pointer transition-all duration-100 hover:bg-s100 hover:text-s600"
                        id="add-device-close"
                    >
                        ✕
                    </button>
                </div>
                <div class="p-5 px-6">
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-s500 mb-1.5">设备地址</label>
                        <input
                            type="text"
                            class="w-full px-3.5 py-2.5 border border-s200 rounded-sm font-mono text-[13px] text-s800 bg-s50 outline-none transition-colors duration-150 focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.1)] placeholder:text-s300"
                            id="add-device-addr"
                            placeholder="192.168.1.100:5555"
                            autofocus
                        />
                        <span class="block text-[11px] text-s400 mt-1"
                            >IP 地址，可附带端口号（默认: 5555）</span
                        >
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-s500 mb-1.5"
                            >名称（可选）</label
                        >
                        <input
                            type="text"
                            class="w-full px-3.5 py-2.5 border border-s200 rounded-sm font-mono text-[13px] text-s800 bg-s50 outline-none transition-colors duration-150 focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.1)] placeholder:text-s300"
                            id="add-device-name"
                            placeholder="我的手机"
                        />
                    </div>
                    <div class="flex gap-2 justify-end mt-4.5">
                        <button
                            class="px-5 py-2 rounded-sm font-sans text-xs font-semibold cursor-pointer border border-s200 bg-s50 text-s500 transition-all duration-150 hover:border-s300 hover:bg-s50"
                            id="add-device-cancel"
                        >
                            取消
                        </button>
                        <button
                            class="form-btn-primary px-5 py-2 rounded-sm font-sans text-xs font-semibold cursor-pointer border border-blue bg-blue text-white shadow-[0_2px_8px_rgba(37,99,235,.2)] transition-all duration-150 hover:bg-blue-dark hover:border-blue-dark"
                            id="add-device-submit"
                        >
                            连接
                        </button>
                    </div>
                    <div
                        class="mt-2.5 px-3.5 py-2.5 rounded-sm bg-red-light border border-red/30 text-red text-xs"
                        id="add-device-error"
                        style="display: none"
                    ></div>
                </div>
            </div>
        </div>

        <!-- 信息弹窗 -->
        <div class="modal-mask" id="modal" style="display: none">
            <div class="modal-card">
                <div class="flex items-center justify-between px-6 py-4.5 border-b border-s100">
                    <h3 class="text-base font-bold text-s900">设备信息</h3>
                    <button
                        class="w-8 h-8 flex items-center justify-center bg-transparent border-none rounded-sm text-s400 text-base cursor-pointer transition-all duration-100 hover:bg-s100 hover:text-s600"
                        id="modal-close"
                    >
                        ✕
                    </button>
                </div>
                <div class="p-5 px-6" id="modal-body">加载中…</div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="modal-mask" id="settings-overlay" style="display: none">
            <div class="modal-card max-w-[440px] w-[90%]">
                <div class="flex items-center justify-between px-6 py-4.5 border-b border-s100">
                    <h3 class="text-base font-bold text-s900">⚙ 设置</h3>
                    <button
                        class="w-8 h-8 flex items-center justify-center bg-transparent border-none rounded-sm text-s400 text-base cursor-pointer transition-all duration-100 hover:bg-s100 hover:text-s600"
                        id="settings-close"
                    >
                        ✕
                    </button>
                </div>
                <div class="px-6 py-4">
                    <div class="mb-4">
                        <h4 class="text-xs font-extrabold text-s400 mb-2.5 uppercase tracking-wide">
                            MQTT 服务器
                        </h4>
                        <div class="flex items-center gap-2.5 mb-2">
                            <label class="w-20 text-xs font-semibold text-s400 shrink-0"
                                >主机</label
                            >
                            <input
                                type="text"
                                id="set-mqtt-host"
                                placeholder="127.0.0.1"
                                class="flex-1 px-3 py-2 border border-s200 rounded-sm text-[13px] font-mono bg-s50 text-s800 transition-colors duration-150 outline-none focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.08)] placeholder:text-s300"
                            />
                        </div>
                        <div class="flex items-center gap-2.5 mb-2">
                            <label class="w-20 text-xs font-semibold text-s400 shrink-0"
                                >端口</label
                            >
                            <input
                                type="number"
                                id="set-mqtt-port"
                                placeholder="1883"
                                class="flex-1 px-3 py-2 border border-s200 rounded-sm text-[13px] font-mono bg-s50 text-s800 transition-colors duration-150 outline-none focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.08)] placeholder:text-s300"
                            />
                        </div>
                        <div class="flex items-center gap-2.5 mb-2">
                            <label class="w-20 text-xs font-semibold text-s400 shrink-0"
                                >客户端 ID</label
                            >
                            <input
                                type="text"
                                id="set-mqtt-client-id"
                                placeholder="automatex-001"
                                class="flex-1 px-3 py-2 border border-s200 rounded-sm text-[13px] font-mono bg-s50 text-s800 transition-colors duration-150 outline-none focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.08)] placeholder:text-s300"
                            />
                        </div>
                        <div class="flex items-center gap-2.5 mb-2">
                            <label class="w-20 text-xs font-semibold text-s400 shrink-0"
                                >用户名</label
                            >
                            <input
                                type="text"
                                id="set-mqtt-username"
                                placeholder="（可选）"
                                class="flex-1 px-3 py-2 border border-s200 rounded-sm text-[13px] font-mono bg-s50 text-s800 transition-colors duration-150 outline-none focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.08)] placeholder:text-s300"
                            />
                        </div>
                        <div class="flex items-center gap-2.5 mb-2">
                            <label class="w-20 text-xs font-semibold text-s400 shrink-0"
                                >密码</label
                            >
                            <input
                                type="password"
                                id="set-mqtt-password"
                                placeholder="（可选）"
                                class="flex-1 px-3 py-2 border border-s200 rounded-sm text-[13px] font-mono bg-s50 text-s800 transition-colors duration-150 outline-none focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.08)] placeholder:text-s300"
                            />
                        </div>
                    </div>
                    <div class="mb-4">
                        <h4 class="text-xs font-extrabold text-s400 mb-2.5 uppercase tracking-wide">
                            MQTT 状态
                        </h4>
                        <div class="flex items-center gap-2">
                            <span
                                class="w-2 h-2 rounded-full bg-s300 shrink-0"
                                id="mqtt-dot"
                            ></span>
                            <span class="text-xs text-s500 flex-1" id="mqtt-status-text"
                                >未连接</span
                            >
                            <button
                                class="px-3 py-1 text-[11px] font-semibold rounded-sm border border-green text-green cursor-pointer transition-all duration-150 bg-white hover:bg-green-light disabled:opacity-40 disabled:cursor-not-allowed"
                                id="btn-mqtt-connect"
                            >
                                连接
                            </button>
                            <button
                                class="px-3 py-1 text-[11px] font-semibold rounded-sm border border-red text-red cursor-pointer transition-all duration-150 bg-white hover:bg-red-light disabled:opacity-40 disabled:cursor-not-allowed"
                                id="btn-mqtt-disconnect"
                                disabled
                            >
                                断开
                            </button>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-2 px-6 py-3.5 border-t border-s100">
                    <button
                        class="flex flex-col items-center justify-center gap-1 px-1.5 py-2.5 border border-s200 rounded-md bg-white text-[10px] font-bold text-s500 uppercase tracking-normal shadow-1 cursor-pointer transition-all duration-[180ms] hover:-translate-y-px hover:shadow-2"
                        id="settings-cancel"
                    >
                        取消
                    </button>
                    <button
                        class="flex flex-col items-center justify-center gap-1 px-1.5 py-2.5 border border-s200 rounded-md bg-white text-[10px] font-bold text-orange uppercase tracking-normal shadow-1 cursor-pointer transition-all duration-[180ms] hover:-translate-y-px hover:shadow-2 hover:border-orange hover:text-white hover:bg-orange"
                        id="settings-save"
                    >
                        保存
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
