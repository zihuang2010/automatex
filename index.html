<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/frontends/styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AutomateX 工作台 PRO</title>
    </head>

    <body>
        <!-- ===== 开屏（写轮眼风格） ===== -->
        <div class="splash" id="splash">
            <!-- 暗色背景光晕 -->
            <div class="splash-bg-glow splash-bg-glow-1"></div>
            <div class="splash-bg-glow splash-bg-glow-2"></div>
            <div class="splash-bg-glow splash-bg-glow-3"></div>

            <!-- 网格底纹 -->
            <div class="splash-grid"></div>

            <!-- 浮动粒子（红色系） -->
            <div class="splash-particles">
                <div
                    class="splash-particle"
                    style="
                        --x: 12%;
                        --y: 18%;
                        --size: 4px;
                        --dur: 6s;
                        --delay: 0s;
                        --color: rgba(220, 38, 38, 0.5);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 82%;
                        --y: 12%;
                        --size: 3px;
                        --dur: 8s;
                        --delay: 1s;
                        --color: rgba(239, 68, 68, 0.4);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 20%;
                        --y: 78%;
                        --size: 5px;
                        --dur: 7s;
                        --delay: 0.5s;
                        --color: rgba(185, 28, 28, 0.35);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 72%;
                        --y: 82%;
                        --size: 3px;
                        --dur: 9s;
                        --delay: 2s;
                        --color: rgba(220, 38, 38, 0.3);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 50%;
                        --y: 8%;
                        --size: 4px;
                        --dur: 10s;
                        --delay: 1.5s;
                        --color: rgba(239, 68, 68, 0.3);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 88%;
                        --y: 50%;
                        --size: 3px;
                        --dur: 7s;
                        --delay: 0.8s;
                        --color: rgba(185, 28, 28, 0.4);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 8%;
                        --y: 55%;
                        --size: 5px;
                        --dur: 11s;
                        --delay: 3s;
                        --color: rgba(220, 38, 38, 0.25);
                    "
                ></div>
                <div
                    class="splash-particle"
                    style="
                        --x: 42%;
                        --y: 88%;
                        --size: 3px;
                        --dur: 8s;
                        --delay: 2.5s;
                        --color: rgba(239, 68, 68, 0.35);
                    "
                ></div>
            </div>

            <!-- Shimmer 光带（红色） -->
            <div class="splash-shimmer"></div>

            <!-- 中心内容 -->
            <div class="splash-center">
                <div class="splash-glow"></div>
                <div class="splash-logo-wrap">
                    <!-- 写轮眼 SVG -->
                    <svg
                        class="splash-logo sharingan-spin"
                        viewBox="0 0 200 200"
                        width="140"
                        height="140"
                    >
                        <defs>
                            <radialGradient id="iris-grad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#dc2626" />
                                <stop offset="60%" stop-color="#b91c1c" />
                                <stop offset="100%" stop-color="#7f1d1d" />
                            </radialGradient>
                            <radialGradient id="pupil-grad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#1a1a1a" />
                                <stop offset="100%" stop-color="#000000" />
                            </radialGradient>
                            <filter id="eye-glow">
                                <feGaussianBlur stdDeviation="4" result="blur" />
                                <feMerge>
                                    <feMergeNode in="blur" />
                                    <feMergeNode in="SourceGraphic" />
                                </feMerge>
                            </filter>
                            <filter id="tomoe-glow">
                                <feDropShadow
                                    dx="0"
                                    dy="0"
                                    stdDeviation="2"
                                    flood-color="#000"
                                    flood-opacity="0.8"
                                />
                            </filter>
                        </defs>

                        <!-- 外圈光环 -->
                        <circle
                            cx="100"
                            cy="100"
                            r="88"
                            fill="none"
                            stroke="#dc2626"
                            stroke-width="2"
                            opacity="0.3"
                            filter="url(#eye-glow)"
                        />
                        <circle
                            cx="100"
                            cy="100"
                            r="92"
                            fill="none"
                            stroke="#ef4444"
                            stroke-width="0.5"
                            opacity="0.2"
                        />

                        <!-- 虹膜 -->
                        <circle
                            cx="100"
                            cy="100"
                            r="80"
                            fill="url(#iris-grad)"
                            filter="url(#eye-glow)"
                        />

                        <!-- 虹膜纹理环 -->
                        <circle
                            cx="100"
                            cy="100"
                            r="70"
                            fill="none"
                            stroke="#991b1b"
                            stroke-width="0.8"
                            opacity="0.4"
                        />
                        <circle
                            cx="100"
                            cy="100"
                            r="55"
                            fill="none"
                            stroke="#7f1d1d"
                            stroke-width="0.5"
                            opacity="0.3"
                        />

                        <!-- 勾玉容器（旋转） -->
                        <g class="tomoe-group" filter="url(#tomoe-glow)">
                            <!-- 勾玉 1（上方） -->
                            <g transform="rotate(0 100 100)">
                                <circle cx="100" cy="48" r="10" fill="#0a0a0a" />
                                <path
                                    d="M100,48 Q100,75 100,100"
                                    stroke="#0a0a0a"
                                    stroke-width="5"
                                    fill="none"
                                    stroke-linecap="round"
                                />
                                <circle cx="100" cy="51" r="4" fill="#dc2626" opacity="0.6" />
                            </g>
                            <!-- 勾玉 2（右下） -->
                            <g transform="rotate(120 100 100)">
                                <circle cx="100" cy="48" r="10" fill="#0a0a0a" />
                                <path
                                    d="M100,48 Q100,75 100,100"
                                    stroke="#0a0a0a"
                                    stroke-width="5"
                                    fill="none"
                                    stroke-linecap="round"
                                />
                                <circle cx="100" cy="51" r="4" fill="#dc2626" opacity="0.6" />
                            </g>
                            <!-- 勾玉 3（左下） -->
                            <g transform="rotate(240 100 100)">
                                <circle cx="100" cy="48" r="10" fill="#0a0a0a" />
                                <path
                                    d="M100,48 Q100,75 100,100"
                                    stroke="#0a0a0a"
                                    stroke-width="5"
                                    fill="none"
                                    stroke-linecap="round"
                                />
                                <circle cx="100" cy="51" r="4" fill="#dc2626" opacity="0.6" />
                            </g>
                        </g>

                        <!-- 瞳孔 -->
                        <circle cx="100" cy="100" r="18" fill="url(#pupil-grad)" />
                        <!-- 瞳孔高光 -->
                        <ellipse
                            cx="93"
                            cy="93"
                            rx="5"
                            ry="4"
                            fill="white"
                            opacity="0.12"
                            transform="rotate(-30 93 93)"
                        />
                    </svg>
                </div>
                <div class="splash-time">--:--</div>
                <h1 class="splash-name">AutomateX</h1>
                <span class="splash-version">v1.0.2-STABLE</span>
            </div>
        </div>

        <!-- ===== 主应用 ===== -->
        <div class="app h-screen flex flex-col overflow-hidden" id="app">
            <!-- Header -->
            <header
                class="bg-[var(--premium-bg)] border-b border-s200 pl-4 pr-5 pt-3 pb-2 flex items-center justify-between shrink-0 z-30"
                data-tauri-drag-region
            >
                <div class="flex items-center space-x-2">
                    <!-- macOS 交通灯按钮（默认隐藏，JS 检测到 macOS 时显示）-->
                    <div id="mac-controls" class="hidden items-center gap-2 mr-3">
                        <button
                            id="btn-mac-close"
                            class="w-3 h-3 rounded-full bg-[#ff5f57] hover:brightness-90 transition-all flex items-center justify-center group"
                            title="关闭"
                        >
                            <svg
                                class="w-1.5 h-1.5 opacity-0 group-hover:opacity-100 transition-opacity"
                                viewBox="0 0 6 6"
                            >
                                <line
                                    x1="0.5"
                                    y1="0.5"
                                    x2="5.5"
                                    y2="5.5"
                                    stroke="#4a0002"
                                    stroke-width="1.2"
                                    stroke-linecap="round"
                                />
                                <line
                                    x1="5.5"
                                    y1="0.5"
                                    x2="0.5"
                                    y2="5.5"
                                    stroke="#4a0002"
                                    stroke-width="1.2"
                                    stroke-linecap="round"
                                />
                            </svg>
                        </button>
                        <button
                            id="btn-mac-minimize"
                            class="w-3 h-3 rounded-full bg-[#febc2e] hover:brightness-90 transition-all flex items-center justify-center group"
                            title="最小化"
                        >
                            <svg
                                class="w-1.5 h-1.5 opacity-0 group-hover:opacity-100 transition-opacity"
                                viewBox="0 0 6 6"
                            >
                                <line
                                    x1="0.5"
                                    y1="3"
                                    x2="5.5"
                                    y2="3"
                                    stroke="#995700"
                                    stroke-width="1.2"
                                    stroke-linecap="round"
                                />
                            </svg>
                        </button>
                        <button
                            id="btn-mac-maximize"
                            class="w-3 h-3 rounded-full bg-[#28c840] hover:brightness-90 transition-all flex items-center justify-center group"
                            title="最大化"
                        >
                            <svg
                                class="w-1.5 h-1.5 opacity-0 group-hover:opacity-100 transition-opacity"
                                viewBox="0 0 6 6"
                            >
                                <polyline
                                    points="1,3.5 3,1 5,3.5"
                                    fill="none"
                                    stroke="#006500"
                                    stroke-width="1.2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                                <polyline
                                    points="1,2.5 3,5 5,2.5"
                                    fill="none"
                                    stroke="#006500"
                                    stroke-width="1.2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </button>
                    </div>
                    <div class="flex items-baseline space-x-2">
                        <h1 class="text-sm font-black tracking-tight text-s800 leading-none">
                            AutomateX Workspace <span class="text-blue">PRO</span>
                        </h1>
                        <span
                            class="text-[12px] text-s400 font-bold uppercase tracking-normal border-l border-s200 pl-2"
                            >企业客户端</span
                        >
                    </div>
                </div>
                <div class="flex items-center gap-1">
                    <button
                        id="topbar-status"
                        class="w-6 h-6 flex items-center justify-center rounded-md hover:bg-s100 transition-colors text-green-500"
                        title="网络状态"
                    >
                        <span class="material-symbols-outlined icon-sm" id="net-status-icon"
                            >wifi</span
                        >
                    </button>
                    <button
                        id="btn-theme-toggle"
                        class="w-6 h-6 flex items-center justify-center rounded-md hover:bg-s100 transition-colors text-s400 hover:text-s600"
                        title="切换主题"
                    >
                        <span class="material-symbols-outlined icon-sm" id="theme-icon"
                            >dark_mode</span
                        >
                    </button>
                    <!-- Windows 窗口控制按钮（默认隐藏，JS 检测到 Windows 时显示） -->
                    <div id="window-controls" class="hidden items-center ml-1 -mr-3">
                        <button
                            id="btn-win-minimize"
                            class="w-[46px] h-[32px] flex items-center justify-center hover:bg-s200/80 transition-colors text-s500"
                            title="最小化"
                        >
                            <svg width="10" height="1" viewBox="0 0 10 1">
                                <line
                                    x1="0"
                                    y1="0.5"
                                    x2="10"
                                    y2="0.5"
                                    stroke="currentColor"
                                    stroke-width="1"
                                />
                            </svg>
                        </button>
                        <button
                            id="btn-win-maximize"
                            class="w-[46px] h-[32px] flex items-center justify-center hover:bg-s200/80 transition-colors text-s500"
                            title="最大化"
                        >
                            <svg width="10" height="10" viewBox="0 0 10 10">
                                <rect
                                    x="0.5"
                                    y="0.5"
                                    width="9"
                                    height="9"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1"
                                />
                            </svg>
                        </button>
                        <button
                            id="btn-win-close"
                            class="w-[46px] h-[32px] flex items-center justify-center hover:bg-[#c42b1c] hover:text-white transition-colors text-s500"
                            title="关闭"
                        >
                            <svg width="10" height="10" viewBox="0 0 10 10">
                                <line
                                    x1="0"
                                    y1="0"
                                    x2="10"
                                    y2="10"
                                    stroke="currentColor"
                                    stroke-width="1"
                                />
                                <line
                                    x1="10"
                                    y1="0"
                                    x2="0"
                                    y2="10"
                                    stroke="currentColor"
                                    stroke-width="1"
                                />
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- 三栏主体 -->
            <main class="flex-1 p-3 flex gap-3 overflow-hidden">
                <!-- 左栏：任务队列 -->
                <aside
                    class="w-[280px] bg-white rounded-md border border-[var(--panel-border)] shadow-sm flex flex-col h-full overflow-hidden shrink-0"
                >
                    <div
                        class="p-3 border-b border-s100 bg-s50/30 flex justify-between items-center"
                    >
                        <div>
                            <h2
                                class="text-[13px] font-black text-s500 uppercase tracking-normal leading-none"
                            >
                                任务队列
                            </h2>
                            <p
                                class="text-[10px] text-s400 font-bold mt-1 uppercase tracking-normal queue-sub"
                            >
                                0 个进行中任务
                            </p>
                        </div>
                        <button class="material-symbols-outlined text-s400 text-base">
                            filter_list
                        </button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-2.5 space-y-2" id="chain-cards">
                        <div class="empty-hint">选择任务以查看详情</div>
                    </div>
                </aside>

                <!-- 中栏：任务详情 -->
                <section class="flex-1 flex flex-col h-full overflow-hidden min-w-0" id="col-mid">
                    <div class="empty-hint" style="padding: 40px; text-align: center">
                        选择任务以查看详情
                    </div>
                </section>

                <!-- 右栏：设备管理 -->
                <aside
                    class="w-[280px] bg-white rounded-md border border-[var(--panel-border)] shadow-sm flex flex-col h-full overflow-hidden shrink-0"
                >
                    <div
                        class="p-3 border-b border-s100 flex justify-between items-center bg-s50/30"
                    >
                        <h2 class="text-[13px] font-black text-s500 uppercase tracking-normal">
                            设备管理
                        </h2>
                        <span
                            class="text-[11px] font-bold text-s400 bg-s200/50 px-1.5 py-0.5 rounded"
                            id="dev-count"
                            >共 0 台</span
                        >
                    </div>
                    <div class="flex-1 overflow-y-auto" id="device-tree">
                        <div class="empty-hint">点击 <strong>WiFi</strong> 添加设备</div>
                    </div>
                    <div class="p-3 border-t border-s100 bg-white space-y-2">
                        <div class="grid grid-cols-3 gap-1.5">
                            <button
                                class="flex flex-col items-center justify-center py-2 bg-white border border-s200 text-s500 hover:border-blue-500 hover:text-blue-600 rounded-lg transition-all text-[9px] font-black uppercase"
                                id="btn-add-device"
                            >
                                <span class="material-symbols-outlined text-base mb-0.5">wifi</span
                                >WiFi连接
                            </button>
                            <button
                                class="flex flex-col items-center justify-center py-2 bg-white border border-s200 text-s300 rounded-lg transition-all text-[9px] font-black uppercase disabled:opacity-50 disabled:cursor-not-allowed enabled:text-orange-500 enabled:border-orange-200 enabled:hover:bg-orange-50 enabled:hover:border-orange-400"
                                id="btn-unflag-device"
                                disabled
                            >
                                <span class="material-symbols-outlined text-base mb-0.5"
                                    >verified</span
                                >解除标记
                            </button>
                            <button
                                class="flex flex-col items-center justify-center py-2 bg-white border border-s200 text-s300 rounded-lg transition-all text-[9px] font-black uppercase disabled:opacity-50 disabled:cursor-not-allowed enabled:text-red-500 enabled:border-red-200 enabled:hover:bg-red-50 enabled:hover:border-red-400"
                                id="btn-remove-selected"
                                disabled
                            >
                                <span class="material-symbols-outlined text-base mb-0.5"
                                    >delete</span
                                >移除设备
                            </button>
                        </div>
                        <div class="flex items-center justify-between pt-1">
                            <span class="text-[8px] font-bold text-s400 uppercase tracking-widest"
                                >v1.0.2-STABLE</span
                            >
                            <button
                                class="text-s400 hover:text-s600 transition-colors"
                                id="btn-settings"
                            >
                                <span class="material-symbols-outlined text-lg">settings</span>
                            </button>
                        </div>
                    </div>
                </aside>
            </main>
        </div>

        <!-- 添加设备对话框 -->
        <div class="modal-mask" id="add-device-modal" style="display: none">
            <div class="modal-card" style="max-width: 400px">
                <div class="flex items-center justify-between px-6 py-4.5 border-b border-s100">
                    <h3 class="text-base font-bold text-s900">添加设备</h3>
                    <button
                        class="w-8 h-8 flex items-center justify-center bg-transparent border-none rounded-sm text-s400 text-base cursor-pointer transition-all duration-100 hover:bg-s100 hover:text-s600"
                        id="add-device-close"
                    >
                        ✕
                    </button>
                </div>
                <div class="p-5 px-6">
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-s500 mb-1.5">设备地址</label>
                        <input
                            type="text"
                            class="w-full px-3.5 py-2.5 border border-s200 rounded-sm font-mono text-[13px] text-s800 bg-s50 outline-none transition-colors duration-150 focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.1)] placeholder:text-s300"
                            id="add-device-addr"
                            placeholder="192.168.1.100:5555"
                            autofocus
                        />
                        <span class="block text-[11px] text-s400 mt-1"
                            >IP 地址，可附带端口号（默认: 5555）</span
                        >
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-s500 mb-1.5"
                            >名称（可选）</label
                        >
                        <input
                            type="text"
                            class="w-full px-3.5 py-2.5 border border-s200 rounded-sm font-mono text-[13px] text-s800 bg-s50 outline-none transition-colors duration-150 focus:border-blue focus:shadow-[0_0_0_3px_rgba(37,99,235,.1)] placeholder:text-s300"
                            id="add-device-name"
                            placeholder="我的手机"
                        />
                    </div>
                    <div class="flex gap-2 justify-end mt-4.5">
                        <button
                            class="px-5 py-2 rounded-sm font-sans text-xs font-semibold cursor-pointer border border-s200 bg-s50 text-s500 transition-all duration-150 hover:border-s300 hover:bg-s50"
                            id="add-device-cancel"
                        >
                            取消
                        </button>
                        <button
                            class="form-btn-primary px-5 py-2 rounded-sm font-sans text-xs font-semibold cursor-pointer border border-blue bg-blue text-white shadow-[0_2px_8px_rgba(37,99,235,.2)] transition-all duration-150 hover:bg-blue-dark hover:border-blue-dark"
                            id="add-device-submit"
                        >
                            连接
                        </button>
                    </div>
                    <div
                        class="mt-2.5 px-3.5 py-2.5 rounded-sm bg-red-light border border-red/30 text-red text-xs"
                        id="add-device-error"
                        style="display: none"
                    ></div>
                </div>
            </div>
        </div>

        <!-- 信息弹窗 -->
        <div class="modal-mask" id="modal" style="display: none">
            <div class="modal-card">
                <div class="flex items-center justify-between px-6 py-4.5 border-b border-s100">
                    <h3 class="text-base font-bold text-s900">设备信息</h3>
                    <button
                        class="w-8 h-8 flex items-center justify-center bg-transparent border-none rounded-sm text-s400 text-base cursor-pointer transition-all duration-100 hover:bg-s100 hover:text-s600"
                        id="modal-close"
                    >
                        ✕
                    </button>
                </div>
                <div class="p-5 px-6" id="modal-body">加载中…</div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="modal-mask" id="settings-overlay" style="display: none">
            <div
                class="w-full max-w-lg bg-white rounded-[16px] overflow-hidden border border-s100 shadow-xl"
            >
                <!-- Header -->
                <div class="px-6 py-4 flex items-center justify-between border-b border-s100">
                    <div class="flex items-center gap-2 text-s800">
                        <span class="material-symbols-outlined text-s400 text-xl">settings</span>
                        <h1 class="text-lg font-semibold tracking-tight">设置</h1>
                    </div>
                    <button
                        class="text-s400 hover:text-s600 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-s100"
                        id="settings-close"
                    >
                        <span class="material-symbols-outlined text-xl">close</span>
                    </button>
                </div>

                <!-- Body -->
                <div class="p-6 space-y-8">
                    <section class="space-y-4">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-s400 px-1">
                            MQTT 服务器
                        </h2>
                        <div class="space-y-5">
                            <div class="grid grid-cols-12 gap-4">
                                <div class="col-span-8 space-y-2">
                                    <label class="block text-sm font-medium text-s600 px-1"
                                        >主机</label
                                    >
                                    <input
                                        type="text"
                                        id="set-mqtt-host"
                                        placeholder="127.0.0.1"
                                        class="w-full bg-s50 border border-s200 rounded-lg px-4 py-2.5 text-s700 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-mono text-sm outline-none"
                                    />
                                </div>
                                <div class="col-span-4 space-y-2">
                                    <label class="block text-sm font-medium text-s600 px-1"
                                        >端口</label
                                    >
                                    <input
                                        type="number"
                                        id="set-mqtt-port"
                                        placeholder="1883"
                                        class="w-full bg-s50 border border-s200 rounded-lg px-4 py-2.5 text-s700 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-mono text-sm outline-none"
                                    />
                                </div>
                            </div>

                            <div class="space-y-2">
                                <label class="block text-sm font-medium text-s600 px-1"
                                    >客户端 ID</label
                                >
                                <input
                                    type="text"
                                    id="set-mqtt-client-id"
                                    placeholder="automatex-001"
                                    class="w-full bg-s50 border border-s200 rounded-lg px-4 py-2.5 text-s700 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-mono text-sm outline-none"
                                />
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-2">
                                    <label class="block text-sm font-medium text-s600 px-1"
                                        >用户名
                                        <span class="text-s400 font-normal text-xs"
                                            >(可选)</span
                                        ></label
                                    >
                                    <input
                                        type="text"
                                        id="set-mqtt-username"
                                        placeholder="请输入用户名"
                                        class="w-full bg-s50 border border-s200 rounded-lg px-4 py-2.5 text-s700 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-sm outline-none"
                                    />
                                </div>
                                <div class="space-y-2">
                                    <label class="block text-sm font-medium text-s600 px-1"
                                        >密码
                                        <span class="text-s400 font-normal text-xs"
                                            >(可选)</span
                                        ></label
                                    >
                                    <input
                                        type="password"
                                        id="set-mqtt-password"
                                        placeholder="请输入密码"
                                        class="w-full bg-s50 border border-s200 rounded-lg px-4 py-2.5 text-s700 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all text-sm outline-none"
                                    />
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="space-y-4">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-s400 px-1">
                            MQTT 状态
                        </h2>
                        <div
                            class="flex items-center justify-between p-4 bg-white rounded-xl border border-s100 shadow-sm"
                        >
                            <div class="flex items-center gap-3">
                                <span class="relative flex h-2.5 w-2.5">
                                    <span
                                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gray-300 opacity-75"
                                        id="mqtt-ping"
                                    ></span>
                                    <span
                                        class="relative inline-flex rounded-full h-2.5 w-2.5 bg-gray-300"
                                        id="mqtt-dot"
                                    ></span>
                                </span>
                                <span class="text-sm font-semibold text-s500" id="mqtt-status-text"
                                    >未连接</span
                                >
                            </div>
                            <div class="flex gap-2">
                                <button
                                    class="px-5 py-1.5 text-sm font-bold rounded-full border-2 border-emerald-500/20 text-emerald-600 hover:bg-emerald-50 hover:border-emerald-500/40 transition-all active:scale-95 disabled:opacity-40"
                                    id="btn-mqtt-connect"
                                >
                                    连接
                                </button>
                                <button
                                    class="px-5 py-1.5 text-sm font-bold rounded-full border-2 border-rose-500/10 text-rose-400 hover:bg-rose-50 hover:border-rose-500/30 transition-all active:scale-95 disabled:opacity-40"
                                    id="btn-mqtt-disconnect"
                                    disabled
                                >
                                    断开
                                </button>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Footer -->
                <div class="px-6 py-5 bg-s50 flex justify-end gap-3 border-t border-s100">
                    <button
                        class="px-6 py-2 text-sm font-medium text-s600 border border-s300 rounded-lg hover:bg-white transition-all"
                        id="settings-cancel"
                    >
                        取消
                    </button>
                    <button
                        class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-2 text-sm font-semibold rounded-lg shadow-sm transition-all active:scale-[0.98]"
                        id="settings-save"
                    >
                        保存
                    </button>
                </div>
            </div>
        </div>

        <script type="module" src="/frontends/main.ts"></script>
    </body>
</html>
